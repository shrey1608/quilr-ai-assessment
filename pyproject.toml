[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quilr-gateway-assessment"
version = "0.1.0"
description = "MCP server and security / LLM gateway assessment"
requires-python = ">=3.11"
dependencies = [
  "mcp==1.26.0",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.8,<3",
  "aiosqlite>=0.21,<1",
  "PyJWT>=2.10,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
quilr-mcp = "quilr_gateway.mcp_server:main"
quilr-token = "quilr_gateway.auth:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quilr_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
